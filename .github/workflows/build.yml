name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DartLED.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DartLED.apk \
            --target "${{ github.sha }}" \
            --title "Dart LED – build ${{ github.run_number }}" \
            --notes "Open this page on your tablet and tap DartLED.apk to download and install."
