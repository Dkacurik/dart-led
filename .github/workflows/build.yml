name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Sim tests
        run: |
          javac -d "$RUNNER_TEMP/sim" cam/src/main/java/sk/kacurik/dartcam/core/*.java tools/dartcam-sim/*.java
          java -cp "$RUNNER_TEMP/sim" SimTest
          java -cp "$RUNNER_TEMP/sim" AutoCalTest
          java -cp "$RUNNER_TEMP/sim" RefineTest
          java -cp "$RUNNER_TEMP/sim" TrackerTest
      - name: Build
        run: ./gradlew :app:assembleDebug :cam:assembleDebug --no-daemon --stacktrace
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DartLED.apk
          cp cam/build/outputs/apk/debug/cam-debug.apk DartCam.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DartLED.apk DartCam.apk \
            --target "${{ github.sha }}" \
            --title "Dart LED – build ${{ github.run_number }}" \
            --notes "Tablet: tap DartLED.apk. Phone at the board: tap DartCam.apk."
