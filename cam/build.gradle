plugins {
    id 'com.android.application'
}

android {
    namespace 'sk.kacurik.dartcam'
    compileSdk 34

    defaultConfig {
        applicationId 'sk.kacurik.dartcam'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Same fixed key as Dart LED, so each new build installs as an update.
    signingConfigs {
        debug {
            storeFile file('../app/dartled.keystore')
            storePassword 'dartled'
            keyAlias 'dartled'
            keyPassword 'dartled'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation 'androidx.activity:activity:1.9.2'
}
